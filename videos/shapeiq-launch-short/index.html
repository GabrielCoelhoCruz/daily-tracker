<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ShapeIQ Launch — 20s</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0f0e0d; --ink: #e8e1df; --muted: #78716c; --accent: #f59e0b;
        --gym-warm: rgba(180, 90, 30, 0.25);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--bg); font-family: Inter, system-ui, sans-serif; color: var(--ink);
      }
      .clip {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 80px 56px; text-align: center;
      }
      .bg {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 90% 60% at 50% 100%, var(--gym-warm), transparent 65%), var(--bg);
      }
      .xl { font-size: 80px; font-weight: 900; line-height: 1.08; }
      .lg { font-size: 56px; font-weight: 800; line-height: 1.12; }
      .md { font-size: 44px; font-weight: 700; }
      .accent { color: var(--accent); }
      .feature { font-size: 36px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
      .brand-icon { width: 100px; height: 100px; border-radius: 24px; margin-bottom: 24px; }
      .tag { font-size: 24px; color: var(--muted); font-weight: 600; margin-top: 12px; max-width: 700px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-duration="20" data-width="1080" data-height="1920">

      <section class="clip" data-start="0" data-duration="2" data-track-index="1">
        <div class="bg"></div>
        <div class="xl" id="c1a">Apps fitness</div>
        <div class="xl accent" id="c1b">não entendem prep.</div>
      </section>

      <section class="clip" data-start="2" data-duration="3" data-track-index="1">
        <div class="bg"></div>
        <div class="lg" id="c2">Dieta. Cardio.<br />Treino. Físico.</div>
      </section>

      <section class="clip" data-start="5" data-duration="3" data-track-index="1">
        <div class="bg"></div>
        <img class="brand-icon" id="c3-icon" src="assets/icon.png" alt="" />
        <div class="xl" id="c3">Então construí<br />o <span class="accent">ShapeIQ</span>.</div>
      </section>

      <section class="clip" data-start="8" data-duration="3" data-track-index="1">
        <div class="bg"></div>
        <div class="feature" id="c4">Today Briefing</div>
        <div class="tag" id="c4sub">Próxima ação do dia.</div>
      </section>

      <section class="clip" data-start="11" data-duration="3" data-track-index="1">
        <div class="bg"></div>
        <div class="feature" id="c5">Training Session</div>
        <div class="tag" id="c5sub">Treino guiado.</div>
      </section>

      <section class="clip" data-start="14" data-duration="3" data-track-index="1">
        <div class="bg"></div>
        <div class="feature" id="c6">Physique Intelligence</div>
        <div class="tag" id="c6sub">IA analisando meu físico.</div>
      </section>

      <section class="clip" data-start="17" data-duration="3" data-track-index="1">
        <div class="bg"></div>
        <img class="brand-icon" id="c7-icon" src="assets/icon.png" alt="" />
        <div class="xl" id="c7">Shape<span class="accent">IQ</span></div>
        <div class="tag" id="c7tag">Seu prep. Seu shape. Com IA.</div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#c1a", { y: 50, opacity: 0, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.from("#c1b", { y: 50, opacity: 0, duration: 0.35, ease: "power3.out" }, 0.35);
      tl.from("#c2", { scale: 0.9, opacity: 0, duration: 0.4, ease: "power3.out" }, 2.15);
      tl.from("#c3-icon", { scale: 0.6, opacity: 0, duration: 0.4, ease: "back.out(1.7)" }, 5.1);
      tl.from("#c3", { y: 30, opacity: 0, duration: 0.4, ease: "power3.out" }, 5.35);
      tl.from("#c4", { y: 24, opacity: 0, duration: 0.35, ease: "power2.out" }, 8.1);
      tl.from("#c4sub", { y: 16, opacity: 0, duration: 0.3, ease: "power2.out" }, 8.35);
      tl.from("#c5", { y: 24, opacity: 0, duration: 0.35, ease: "power2.out" }, 11.1);
      tl.from("#c5sub", { y: 16, opacity: 0, duration: 0.3, ease: "power2.out" }, 11.35);
      tl.from("#c6", { y: 24, opacity: 0, duration: 0.35, ease: "power2.out" }, 14.1);
      tl.from("#c6sub", { y: 16, opacity: 0, duration: 0.3, ease: "power2.out" }, 14.35);
      tl.from("#c7-icon", { scale: 0.7, opacity: 0, duration: 0.35, ease: "back.out(1.5)" }, 17.1);
      tl.from("#c7", { y: 20, opacity: 0, duration: 0.35, ease: "power3.out" }, 17.35);
      tl.from("#c7tag", { y: 12, opacity: 0, duration: 0.3, ease: "power2.out" }, 17.55);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
